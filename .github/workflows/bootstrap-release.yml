name: Bootstrap World Clock source

on:
  push:
    paths:
      - ".release-bootstrap/ready"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack release source
        shell: bash
        run: |
          set -euo pipefail
          cat .release-bootstrap/part-0* > /tmp/world-clock-source.b64
          base64 --decode /tmp/world-clock-source.b64 > /tmp/world-clock-source.tar.xz
          echo "3bada54f346fb8aca10d8c4840deaf3f85e2aa4be05c6ea13c16c19fdfbc306d  /tmp/world-clock-source.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/world-clock-source
          tar -xJf /tmp/world-clock-source.tar.xz -C /tmp/world-clock-source

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/world-clock-source/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build World Clock Chrome extension v1.0.0"
          git push origin HEAD:main
