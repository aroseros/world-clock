name: Bootstrap World Clock development tooling

on:
  push:
    paths:
      - ".dev-bootstrap/ready"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack development tooling
        shell: bash
        run: |
          set -euo pipefail
          cat .dev-bootstrap/part-* > /tmp/world-clock-dev.b64
          base64 --decode /tmp/world-clock-dev.b64 > /tmp/world-clock-dev-overlay.tar.xz
          echo "f14c5937fb0d7afd597bb9f4d7c7f77dafba299b96a93680e899fa22413eef95  /tmp/world-clock-dev-overlay.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/world-clock-dev-overlay.tar.xz -C .
          rm -rf .dev-bootstrap
          rm -f .github/workflows/bootstrap-development.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add tests, build scripts, and project documentation"
          git push origin HEAD:main
